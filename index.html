<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #10151d;
    --line: #1c2530;
    --cyan: #4fd8d4;
    --cyan-dim: #2a6b69;
    --amber: #e8b559;
    --text: #dce4ea;
    --text-dim: #6b7885;
    --danger: #d9635a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    overflow: hidden;
  }

  .mono {
    font-family: "SF Mono", "Menlo", monospace;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 8px;
  }

  header .brand {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  header .brand span { color: var(--cyan); }

  #settingsBtn {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #transcriptArea {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.45;
  }

  .bubble.you {
    align-self: flex-end;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
  }

  .bubble.jarvis {
    align-self: flex-start;
    background: rgba(79, 216, 212, 0.06);
    border: 1px solid var(--cyan-dim);
    color: var(--text);
  }

  .bubble.jarvis .tag, .bubble.you .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--text-dim);
  }

  .bubble.jarvis .tag { color: var(--cyan); }

  .bubble.error {
    align-self: center;
    background: rgba(217, 99, 90, 0.08);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13px;
    text-align: center;
  }

  #controls {
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #statusLine {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    height: 16px;
  }

  #statusLine.listening { color: var(--danger); }
  #statusLine.thinking { color: var(--amber); }
  #statusLine.speaking { color: var(--cyan); }

  #talkBtn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid var(--cyan-dim);
    background: radial-gradient(circle at 50% 40%, rgba(79,216,212,0.12), transparent 70%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #talkBtn::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    opacity: 0.4;
  }

  #talkBtn.active {
    border-color: var(--danger);
    box-shadow: 0 0 0 0 rgba(217, 99, 90, 0.5);
    animation: pulse 1.1s infinite;
  }

  #talkBtn.thinking {
    border-color: var(--amber);
    animation: spin 1.4s linear infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(217, 99, 90, 0.45); }
    70%  { box-shadow: 0 0 0 22px rgba(217, 99, 90, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 99, 90, 0); }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  #talkIcon {
    width: 26px;
    height: 26px;
    fill: var(--cyan);
  }

  #talkBtn.active #talkIcon { fill: var(--danger); }
  #talkBtn.thinking #talkIcon { fill: var(--amber); }

  #hint {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Settings modal */
  #settingsModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    z-index: 10;
  }

  #settingsModal.open { display: flex; }

  #settingsPanel {
    background: var(--panel);
    border-top: 1px solid var(--line);
    width: 100%;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    border-radius: 16px 16px 0 0;
  }

  #settingsPanel h2 {
    font-size: 15px;
    margin: 0 0 16px;
    color: var(--text);
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }

  .field small {
    display: block;
    margin-top: 5px;
    color: var(--text-dim);
    font-size: 11px;
  }

  #settingsPanel button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    margin-top: 6px;
  }

  #saveSettings {
    background: var(--cyan);
    color: #06231f;
  }

  #closeSettings {
    background: none;
    color: var(--text-dim);
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand mono">JAR<span>VIS</span></div>
    <button id="settingsBtn">⚙</button>
  </header>

  <div id="transcriptArea"></div>

  <div id="controls">
    <div id="statusLine" class="mono">tap to talk</div>
    <button id="talkBtn">
      <svg id="talkIcon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a1 1 0 0 0-2 0 3 3 0 0 1-6 0 1 1 0 0 0-2 0 5 5 0 0 0 4 4.9V18H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.1A5 5 0 0 0 17 11z"/></svg>
    </button>
    <div id="hint">Deepgram + Groq, on-device keys only</div>
  </div>
</div>

<div id="settingsModal">
  <div id="settingsPanel">
    <h2 class="mono">Settings</h2>
    <div class="field">
      <label>Deepgram API Key</label>
      <input type="password" id="deepgramKey" placeholder="Paste key here" autocapitalize="off" autocorrect="off">
      <small>Free key at console.deepgram.com</small>
    </div>
    <div class="field">
      <label>Groq API Key</label>
      <input type="password" id="groqKey" placeholder="Paste key here" autocapitalize="off" autocorrect="off">
      <small>Free key at console.groq.com</small>
    </div>
    <div class="field">
      <label>ElevenLabs API Key (optional)</label>
      <input type="password" id="elevenlabsKey" placeholder="Leave blank to use built-in voice" autocapitalize="off" autocorrect="off">
      <small>For a more natural voice. Free tier at elevenlabs.io</small>
    </div>
    <div class="field">
      <label>ElevenLabs Voice ID (optional)</label>
      <input type="text" id="elevenlabsVoiceId" placeholder="21m00Tcm4TlvDq8ikWAM" autocapitalize="off" autocorrect="off">
      <small>Find one at elevenlabs.io/app/voice-library. Leave blank for default (Rachel).</small>
    </div>
    <button id="saveSettings">Save</button>
    <button id="clearHistoryBtn" style="background:none;border:1px solid var(--line);color:var(--text-dim);margin-top:6px;">Clear conversation memory</button>
    <button id="closeSettings">Close</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Config / persistence ----------
  const STORAGE_KEY = "jarvis_keys_v1";
  const HISTORY_KEY = "jarvis_history_v1";
  const MAX_HISTORY_MESSAGES = 30; // ~15 exchanges, keeps payload size sane

  function loadKeys() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { deepgram: "", groq: "", elevenlabs: "", voiceId: "" };
    } catch (e) {
      return { deepgram: "", groq: "", elevenlabs: "", voiceId: "" };
    }
  }

  function saveKeys(keys) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
  }

  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(historyArr) {
    try {
      const trimmed = historyArr.slice(-MAX_HISTORY_MESSAGES);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
    } catch (e) {
      // Storage full or unavailable - conversation just won't persist this time
    }
  }

  function clearHistory() {
    localStorage.removeItem(HISTORY_KEY);
  }

  let keys = loadKeys();

  // ---------- DOM refs ----------
  const talkBtn = document.getElementById("talkBtn");
  const statusLine = document.getElementById("statusLine");
  const transcriptArea = document.getElementById("transcriptArea");
  const settingsBtn = document.getElementById("settingsBtn");
  const settingsModal = document.getElementById("settingsModal");
  const closeSettings = document.getElementById("closeSettings");
  const saveSettingsBtn = document.getElementById("saveSettings");
  const deepgramKeyInput = document.getElementById("deepgramKey");
  const groqKeyInput = document.getElementById("groqKey");
  const elevenlabsKeyInput = document.getElementById("elevenlabsKey");
  const elevenlabsVoiceIdInput = document.getElementById("elevenlabsVoiceId");

  deepgramKeyInput.value = keys.deepgram || "";
  groqKeyInput.value = keys.groq || "";
  elevenlabsKeyInput.value = keys.elevenlabs || "";
  elevenlabsVoiceIdInput.value = keys.voiceId || "";

  // ---------- Settings modal ----------
  settingsBtn.addEventListener("click", () => {
    settingsModal.classList.add("open");
  });

  closeSettings.addEventListener("click", () => {
    settingsModal.classList.remove("open");
  });

  saveSettingsBtn.addEventListener("click", () => {
    keys = {
      deepgram: deepgramKeyInput.value.trim(),
      groq: groqKeyInput.value.trim(),
      elevenlabs: elevenlabsKeyInput.value.trim(),
      voiceId: elevenlabsVoiceIdInput.value.trim(),
    };
    saveKeys(keys);
    settingsModal.classList.remove("open");
    addBubble("system", "Settings saved.", "error");
  });

  const clearHistoryBtn = document.getElementById("clearHistoryBtn");
  clearHistoryBtn.addEventListener("click", () => {
    clearHistory();
    history.length = 0;
    transcriptArea.innerHTML = "";
    settingsModal.classList.remove("open");
    addBubble("system", "Conversation memory cleared.", "error");
  });

  // ---------- Conversation state ----------
  const history = loadHistory(); // { role: "user"|"assistant", content: "..." }

  const SYSTEM_INSTRUCTION =
    "You are Jarvis, a crisp and professional personal assistant. " +
    "Keep replies concise, direct, and useful, ideally 1-3 sentences " +
    "since they will be spoken aloud. No filler, no excessive " +
    "enthusiasm. Address the request efficiently, the way a sharp " +
    "executive assistant would. " +
    "You can perform a few real device actions. If the user's request " +
    "clearly matches one of these, you MUST include the exact JSON " +
    "object below somewhere in your reply - never just describe the " +
    "action in words without it, since only the JSON actually triggers " +
    "it: " +
    '{"action":"open_url","url":"https://..."} for opening any website, ' +
    '{"action":"search","query":"..."} for a general web search, ' +
    '{"action":"call","number":"..."} to call a phone number, ' +
    '{"action":"text","number":"...","body":"..."} to compose a text ' +
    "(number optional, blank opens the compose screen), " +
    '{"action":"email","to":"...","subject":"...","body":"..."} to ' +
    "compose an email (fields optional), " +
    '{"action":"directions","destination":"..."} for maps directions, ' +
    '{"action":"map","query":"..."} to show a place on the map. ' +
    'Example: user says "open youtube" -> you reply exactly: ' +
    '{"action":"open_url","url":"https://youtube.com"} Opening YouTube. ' +
    "For anything else, just reply normally with plain spoken text, " +
    "no JSON.";

  function addBubble(who, text, kind) {
    const div = document.createElement("div");
    if (kind === "error") {
      div.className = "bubble error mono";
      div.textContent = text;
    } else {
      div.className = "bubble " + who;
      const tag = document.createElement("span");
      tag.className = "tag mono";
      tag.textContent = who === "you" ? "You" : "Jarvis";
      div.appendChild(tag);
      const body = document.createElement("span");
      body.textContent = text;
      div.appendChild(body);
    }
    transcriptArea.appendChild(div);
    transcriptArea.scrollTop = transcriptArea.scrollHeight;
  }

  function setStatus(text, cls) {
    statusLine.textContent = text;
    statusLine.className = "mono" + (cls ? " " + cls : "");
  }

  // ---------- Recording state machine ----------
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingStream = null;
  let state = "idle"; // idle | recording | thinking | speaking

  async function startRecording() {
    if (!keys.deepgram || !keys.groq) {
      addBubble("system", "Add your Deepgram and Groq API keys in Settings first.", "error");
      settingsModal.classList.add("open");
      return;
    }

    if (state !== "idle") return;

    try {
      recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      addBubble("system", "Microphone permission denied or unavailable: " + e.message, "error");
      return;
    }

    audioChunks = [];

    let mimeType = "audio/webm";
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      // Safari on iOS typically supports mp4/aac instead of webm
      mimeType = "audio/mp4";
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = ""; // let the browser pick a default
      }
    }

    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(recordingStream, { mimeType })
        : new MediaRecorder(recordingStream);
    } catch (e) {
      addBubble("system", "Could not start recorder: " + e.message, "error");
      stopStream();
      return;
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = handleRecordingStop;

    mediaRecorder.start();
    state = "recording";
    talkBtn.classList.add("active");
    setStatus("listening… tap to stop", "listening");
  }

  function stopStream() {
    if (recordingStream) {
      recordingStream.getTracks().forEach((t) => t.stop());
      recordingStream = null;
    }
  }

  function stopRecording() {
    if (state !== "recording" || !mediaRecorder) return;
    mediaRecorder.stop();
    talkBtn.classList.remove("active");
  }

  async function handleRecordingStop() {
    stopStream();

    if (audioChunks.length === 0) {
      state = "idle";
      setStatus("tap to talk");
      return;
    }

    state = "thinking";
    talkBtn.classList.add("thinking");
    setStatus("transcribing…", "thinking");

    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });

    try {
      const transcript = await transcribeWithDeepgram(blob);

      if (!transcript || !transcript.trim()) {
        addBubble("system", "Didn't catch that — no speech detected.", "error");
        resetToIdle();
        return;
      }

      addBubble("you", transcript);
      setStatus("thinking…", "thinking");

      const reply = await askGroq(transcript);

      const parsedAction = tryParseAction(reply);
      if (parsedAction) {
        runAction(parsedAction.action);
        const spoken = parsedAction.spokenText || "Done.";
        addBubble("jarvis", spoken);
        speak(spoken);
      } else {
        addBubble("jarvis", reply);
        speak(reply);
      }
    } catch (err) {
      addBubble("system", "Error: " + err.message, "error");
      resetToIdle();
    }
  }

  function resetToIdle() {
    state = "idle";
    talkBtn.classList.remove("thinking", "active");
    setStatus("tap to talk");
  }

  // ---------- Deepgram STT ----------
  async function transcribeWithDeepgram(blob) {
    const contentType = blob.type || "audio/webm";
    const url = "https://api.deepgram.com/v1/listen?model=nova-2&smart_format=true";

    const response = await fetch(url, {
      method: "POST",
      headers: {
        Authorization: "Token " + keys.deepgram,
        "Content-Type": contentType,
      },
      body: blob,
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error("Deepgram " + response.status + ": " + errText.slice(0, 200));
    }

    const data = await response.json();
    try {
      return data.results.channels[0].alternatives[0].transcript;
    } catch (e) {
      throw new Error("Unexpected Deepgram response format.");
    }
  }

  // ---------- Groq brain ----------
  async function askGroq(userText) {
    const url = "https://api.groq.com/openai/v1/chat/completions";

    const messages = [{ role: "system", content: SYSTEM_INSTRUCTION }]
      .concat(history)
      .concat([{ role: "user", content: userText }]);

    const payload = {
      model: "llama-3.3-70b-versatile",
      messages: messages,
    };

    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + keys.groq,
      },
      body: JSON.stringify(payload),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error("Groq " + response.status + ": " + errText.slice(0, 200));
    }

    const data = await response.json();
    let reply;
    try {
      reply = data.choices[0].message.content.trim();
    } catch (e) {
      throw new Error("Unexpected Groq response format.");
    }

    history.push({ role: "user", content: userText });
    history.push({ role: "assistant", content: reply });
    saveHistory(history);

    return reply;
  }

  // ---------- Device actions ----------
  function tryParseAction(reply) {
    // Strip markdown code fences if the model wrapped the JSON in them
    const cleaned = reply.replace(/```json|```/gi, "");

    // Find the first {...} block anywhere in the reply, not just line 1 -
    // the model doesn't always put it exactly first.
    const match = cleaned.match(/\{[^{}]*"action"[^{}]*\}/);
    if (!match) return null;

    try {
      const parsed = JSON.parse(match[0]);
      if (parsed && parsed.action) {
        const spokenText = cleaned.replace(match[0], "").trim();
        return { action: parsed, spokenText: spokenText };
      }
    } catch (e) {
      // Malformed JSON - treat as normal text
    }
    return null;
  }

  function runAction(action) {
    switch (action.action) {
      case "open_url": {
        let url = action.url || "";
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        window.location.href = url;
        break;
      }
      case "search": {
        const q = encodeURIComponent(action.query || "");
        window.location.href = "https://www.google.com/search?q=" + q;
        break;
      }
      case "call": {
        const num = (action.number || "").replace(/[^0-9+]/g, "");
        if (num) window.location.href = "tel:" + num;
        break;
      }
      case "text": {
        const num = (action.number || "").replace(/[^0-9+]/g, "");
        const body = encodeURIComponent(action.body || "");
        window.location.href = "sms:" + num + (body ? "&body=" + body : "");
        break;
      }
      case "email": {
        const to = encodeURIComponent(action.to || "");
        const subject = encodeURIComponent(action.subject || "");
        const body = encodeURIComponent(action.body || "");
        window.location.href =
          "mailto:" + to + "?subject=" + subject + "&body=" + body;
        break;
      }
      case "directions": {
        const dest = encodeURIComponent(action.destination || "");
        window.location.href = "https://maps.apple.com/?daddr=" + dest;
        break;
      }
      case "map": {
        const q = encodeURIComponent(action.query || "");
        window.location.href = "https://maps.apple.com/?q=" + q;
        break;
      }
      default:
        break;
    }
  }
  const DEFAULT_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"; // "Rachel" - a default ElevenLabs preset voice

  function speakWithBrowser(text) {
    if (!("speechSynthesis" in window)) {
      resetToIdle();
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(safetyTimer);
      resetToIdle();
    };

    utterance.onend = finish;
    utterance.onerror = finish;

    // Safety net: iOS Safari sometimes silently fails to fire onend/onerror
    // when speech is triggered from async code. Never let the UI get stuck.
    const estimatedMs = Math.max(4000, text.length * 90);
    const safetyTimer = setTimeout(finish, estimatedMs);

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }

  function unlockSpeechSynthesis() {
    // iOS Safari requires speech synthesis to be "unlocked" by a direct,
    // synchronous user gesture at least once before it will reliably work
    // when triggered later from async code (after network calls).
    if (!("speechSynthesis" in window) || window.__jarvisSpeechUnlocked) return;
    window.__jarvisSpeechUnlocked = true;
    const primer = new SpeechSynthesisUtterance(" ");
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  }

  async function speakWithElevenLabs(text) {
    const voiceId = keys.voiceId || DEFAULT_VOICE_ID;
    const url = "https://api.elevenlabs.io/v1/text-to-speech/" + voiceId;

    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "audio/mpeg",
        "xi-api-key": keys.elevenlabs,
      },
      body: JSON.stringify({
        text: text,
        model_id: "eleven_multilingual_v2",
      }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error("ElevenLabs " + response.status + ": " + errText.slice(0, 200));
    }

    const audioBlob = await response.blob();
    const audioUrl = URL.createObjectURL(audioBlob);
    const audio = new Audio(audioUrl);

    return new Promise((resolve, reject) => {
      let done = false;
      const finish = (fn) => {
        if (done) return;
        done = true;
        clearTimeout(safetyTimer);
        URL.revokeObjectURL(audioUrl);
        fn();
      };

      audio.onended = () => finish(resolve);
      audio.onerror = () => finish(() => reject(new Error("Audio playback failed")));

      // Safety net in case the audio element never fires ended/error
      const safetyTimer = setTimeout(
        () => finish(resolve),
        Math.max(6000, text.length * 100)
      );

      audio.play().catch((err) => finish(() => reject(err)));
    });
  }

  async function speak(text) {
    talkBtn.classList.remove("thinking");
    state = "speaking";
    setStatus("speaking…", "speaking");

    if (keys.elevenlabs) {
      try {
        await speakWithElevenLabs(text);
        resetToIdle();
        return;
      } catch (err) {
        // Fall through to browser voice if ElevenLabs fails for any reason
        addBubble("system", "ElevenLabs unavailable, using built-in voice instead.", "error");
      }
    }

    speakWithBrowser(text);
  }

  // ---------- Button wiring (tap to start, tap again to stop) ----------
  talkBtn.addEventListener("click", () => {
    unlockSpeechSynthesis();
    if (state === "idle") {
      startRecording();
    } else if (state === "recording") {
      stopRecording();
    }
    // ignore taps while thinking/speaking
  });

  // Warn early if getUserMedia isn't available at all (e.g. non-HTTPS)
  window.addEventListener("load", () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      addBubble(
        "system",
        "Microphone access unavailable. This page must be loaded over HTTPS (not opened as a local file) for the mic to work.",
        "error"
      );
    }
    if (!keys.deepgram || !keys.groq) {
      addBubble("system", "Add your API keys in Settings (top right) to get started.", "error");
    }

    // Re-render any conversation carried over from a previous session
    history.forEach((msg) => {
      addBubble(msg.role === "user" ? "you" : "jarvis", msg.content);
    });
  });
})();
</script>
</body>
</html>
